[project]
name = "modulo-9"
version = "0.1.0"
description = "Base inicial del módulo 9: catálogo, comprobantes y puntos de extensión de ventas y posventa"
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.2",
    "jsonschema==4.26.0",
    "pillow==12.0.0",
    "python-dotenv==1.2.1",
]

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
